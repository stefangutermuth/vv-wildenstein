name: Deploy zu All-Inkl

# Wird bei jedem Push auf main automatisch ausgeführt.
#
# Einziger Auslieferungsweg. Der frühere parallele Cloudflare-Worker wurde am
# 16.08.2026 gelöscht — er hielt eine öffentliche Zweitkopie der Seite vor.
#
# Manueller Trigger über GitHub → Actions → „Deploy zu All-Inkl" → Run workflow.
#
# Auslöser:
#  • push auf main            → Code-Änderungen
#  • workflow_dispatch        → manuell per Knopf
#  • repository_dispatch      → von WordPress (vv-wildenstein) bei neuem/geändertem/
#                               gelöschtem Beitrag oder Termin (Event-Typ: vv-content-updated)
#  • schedule (nächtlich)     → Sicherheitsnetz, falls ein Webhook mal nicht durchkommt

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [vv-content-updated]
  schedule:
    - cron: '0 4 * * *' # täglich 04:00 UTC (06:00 MESZ) als Fallback-Rebuild

# Mehrere schnell aufeinanderfolgende Auslöser zu einem Lauf bündeln; laufenden
# Deploy NICHT abbrechen (rsync soll sauber zu Ende laufen) — der nächste reiht sich an.
concurrency:
  group: deploy-allinkl
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────
  # Grünhainichen → www.gruenhainichen.com (live seit 16.08.2026)
  #
  # Die frühere Testadresse grh.vv-wildenstein.com leitet seitdem per
  # 301 hierher um und wird nicht mehr beliefert.
  # ───────────────────────────────────────────────────────────────────
  deploy-gruenhainichen:
    name: Grünhainichen → www.gruenhainichen.com
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: WP-Cache aus vorherigem Build wiederherstellen
        id: wpcache
        uses: actions/cache@v4
        with:
          path: apps/gruenhainichen/.wp-cache
          key: wp-cache-grh-${{ github.run_id }}
          restore-keys: |
            wp-cache-grh-

      - name: Astro bauen (LIVE — Inhalte aus vv-wildenstein.com, indexierbar)
        run: npm run build:gruenhainichen
        env:
          PUBLIC_CMS_SOURCE: wordpress
          # Kein PUBLIC_STAGING mehr → kein noindex.
          # Die Seite ist seit 16.08.2026 unter www.gruenhainichen.com live
          # und soll von Suchmaschinen gefunden werden.
          WP_AUTH_USER: ${{ secrets.WP_AUTH_USER }}
          WP_AUTH_PASS: ${{ secrets.WP_AUTH_PASS }}

      - name: SSH-Schlüssel laden
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ALLINKL_SSH_KEY }}

      - name: All-Inkl-Host bekannt machen
        env:
          KNOWN_HOSTS: ${{ secrets.ALLINKL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          # Server-Schlüssel fest aus dem Secret schreiben — kein fehleranfälliger
          # Netzwerk-Keyscan bei jedem Lauf mehr.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Per rsync zu gruenhainichen.com hochladen (LIVE)
        run: |
          # Bis zu 3 Versuche gegen vorübergehende Verbindungsprobleme
          for i in 1 2 3; do
            if rsync -avz --delete --human-readable \
              --exclude='.htaccess.local' \
              -e "ssh -o ConnectTimeout=30" \
              apps/gruenhainichen/dist/ \
              ${{ secrets.ALLINKL_SSH_USER }}@${{ secrets.ALLINKL_SSH_HOST }}:/www/htdocs/w01f6038/gruenhainichen.com/; then
              echo "Upload erfolgreich (Versuch $i)"; exit 0
            fi
            echo "rsync Versuch $i fehlgeschlagen — neuer Versuch in 15s…"; sleep 15
          done
          echo "rsync nach 3 Versuchen fehlgeschlagen"; exit 1

      - name: Erfolg
        run: |
          echo "✅ Deploy fertig: https://www.gruenhainichen.com"

      # Läuft NACH dem Hochladen und darf nie blockieren: Eine widersprüchliche
      # Telefonnummer ist ärgerlich, aber kein Grund, eine funktionierende
      # Website nicht zu veröffentlichen. Das Ergebnis erscheint in der
      # Zusammenfassung des Laufs und als Warnung an der betroffenen Zeile.
      - name: Fest eingetragene Kontaktdaten gegen das Redaktionssystem prüfen
        continue-on-error: true
        run: npm run pruefe:daten

  # ───────────────────────────────────────────────────────────────────
  # Börnichen → boernichen.vv-wildenstein.com
  # ───────────────────────────────────────────────────────────────────
  deploy-boernichen:
    name: Börnichen → boernichen.de
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Astro bauen (LIVE — Inhalte aus vv-wildenstein.com, indexierbar)
        run: npm run build:boernichen
        env:
          PUBLIC_CMS_SOURCE: wordpress
          # Kein PUBLIC_STAGING mehr → kein noindex; Live-Seite wird von Suchmaschinen gefunden.
          WP_AUTH_USER: ${{ secrets.WP_AUTH_USER }}
          WP_AUTH_PASS: ${{ secrets.WP_AUTH_PASS }}

      - name: SSH-Schlüssel laden
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ALLINKL_SSH_KEY }}

      - name: All-Inkl-Host bekannt machen
        env:
          KNOWN_HOSTS: ${{ secrets.ALLINKL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          # Server-Schlüssel fest aus dem Secret schreiben — kein fehleranfälliger
          # Netzwerk-Keyscan bei jedem Lauf mehr.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Per rsync zu boernichen.de hochladen
        run: |
          # Bis zu 3 Versuche gegen vorübergehende Verbindungsprobleme
          for i in 1 2 3; do
            if rsync -avz --delete --human-readable \
              --exclude='.htaccess.local' \
              -e "ssh -o ConnectTimeout=30" \
              apps/boernichen/dist/ \
              ${{ secrets.ALLINKL_SSH_USER }}@${{ secrets.ALLINKL_SSH_HOST }}:/www/htdocs/w01f6038/boernichen.de/; then
              echo "Upload erfolgreich (Versuch $i)"; exit 0
            fi
            echo "rsync Versuch $i fehlgeschlagen — neuer Versuch in 15s…"; sleep 15
          done
          echo "rsync nach 3 Versuchen fehlgeschlagen"; exit 1

      - name: Erfolg
        run: |
          echo "✅ Deploy fertig: https://boernichen.de"

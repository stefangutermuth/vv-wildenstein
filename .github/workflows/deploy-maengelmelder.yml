name: Deploy Mängelmelder

# Deployt das Astro-Frontend nach melder.vv-wildenstein.com.
#
# Auslöser:
#  - Push auf main, wenn sich apps/maengelmelder/ ändert (Code-Änderungen)
#  - alle 30 Minuten (holt neue/freigegebene Meldungen + Statusänderungen aus WP)
#  - manuell über GitHub → Actions → „Deploy Mängelmelder" → Run workflow

on:
  push:
    branches: [main]
    paths:
      - 'apps/maengelmelder/**'
      - '.github/workflows/deploy-maengelmelder.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  deploy-maengelmelder:
    name: Mängelmelder → melder.vv-wildenstein.com
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Astro bauen (Live-Daten aus vv-wildenstein.com, Produktion = indexierbar)
        run: npm run build:maengelmelder

      - name: SSH-Schlüssel laden
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.ALLINKL_SSH_KEY }}

      - name: All-Inkl-Host bekannt machen
        run: |
          mkdir -p ~/.ssh
          # Mit Wiederholung gegen kurze Netzwerk-Aussetzer
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 20 -H "${{ secrets.ALLINKL_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
              echo "Host-Key erhalten (Versuch $i)"; exit 0
            fi
            echo "ssh-keyscan Versuch $i fehlgeschlagen — neuer Versuch in 10s…"; sleep 10
          done
          echo "ssh-keyscan nach 5 Versuchen fehlgeschlagen"; exit 1

      - name: Per rsync zu melder.vv-wildenstein.com hochladen
        run: |
          # Bis zu 3 Versuche gegen vorübergehende Verbindungsprobleme
          for i in 1 2 3; do
            if rsync -avz --delete --human-readable \
              --exclude='.well-known' \
              -e "ssh -o ConnectTimeout=30" \
              apps/maengelmelder/dist/ \
              ${{ secrets.ALLINKL_SSH_USER }}@${{ secrets.ALLINKL_SSH_HOST }}:/www/htdocs/w01f6038/melder.vv-wildenstein.com/; then
              echo "Upload erfolgreich (Versuch $i)"; exit 0
            fi
            echo "rsync Versuch $i fehlgeschlagen — neuer Versuch in 15s…"; sleep 15
          done
          echo "rsync nach 3 Versuchen fehlgeschlagen"; exit 1

      - name: Erfolg
        run: |
          echo "Deploy fertig -> https://melder.vv-wildenstein.com"

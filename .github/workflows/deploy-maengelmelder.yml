name: Deploy Mängelmelder

# Deployt das Astro-Frontend nach melder.vv-wildenstein.com.
#
# Auslöser:
#  - repository_dispatch „rebuild-melder": WordPress stößt den Build an, sobald
#    eine Meldung freigegeben/geändert/gelöscht wird (Plugin vw-melder → Auto-Deploy).
#    Das ist jetzt der normale Weg — Aktualisierung nahezu sofort.
#  - Push auf main, wenn sich apps/maengelmelder/ ändert (Code-Änderungen)
#  - 1× täglich per Zeitplan als Sicherheitsnetz (falls ein Dispatch mal ausbleibt).
#    Wenige geplante Läufe = kaum noch GitHub-Runner-Aussetzer ("not acquired"/"cancelled").
#  - manuell über GitHub → Actions → „Deploy Mängelmelder" → Run workflow

on:
  # WordPress löst den Build bei Änderungen aus (Plugin vw-melder, Auto-Deploy)
  repository_dispatch:
    types: [rebuild-melder]
  push:
    branches: [main]
    paths:
      - 'apps/maengelmelder/**'
      - '.github/workflows/deploy-maengelmelder.yml'
  schedule:
    # Sicherheitsnetz: 1× täglich (04:00 UTC ≈ 06:00 lokal). Der eigentliche
    # Auslöser ist jetzt WordPress (repository_dispatch). Wenige geplante Läufe
    # = kaum noch GitHub-Infrastruktur-Aussetzer-Mails.
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  deploy-maengelmelder:
    name: Mängelmelder → melder.vv-wildenstein.com
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Astro bauen (Live-Daten aus vv-wildenstein.com, Produktion = indexierbar)
        run: npm run build:maengelmelder

      - name: SSH-Schlüssel laden
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.ALLINKL_SSH_KEY }}

      - name: Known-Hosts hinterlegen
        env:
          KNOWN_HOSTS: ${{ secrets.ALLINKL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          # Server-Schlüssel fest aus dem Secret schreiben — kein fehleranfälliger
          # Netzwerk-Keyscan bei jedem Lauf mehr.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Per rsync zu melder.vv-wildenstein.com hochladen
        run: |
          # Bis zu 3 Versuche gegen vorübergehende Verbindungsprobleme
          for i in 1 2 3; do
            if rsync -avz --delete --human-readable \
              --exclude='.well-known' \
              -e "ssh -o ConnectTimeout=30" \
              apps/maengelmelder/dist/ \
              ${{ secrets.ALLINKL_SSH_USER }}@${{ secrets.ALLINKL_SSH_HOST }}:/www/htdocs/w01f6038/melder.vv-wildenstein.com/; then
              echo "Upload erfolgreich (Versuch $i)"; exit 0
            fi
            echo "rsync Versuch $i fehlgeschlagen — neuer Versuch in 15s…"; sleep 15
          done
          echo "rsync nach 3 Versuchen fehlgeschlagen"; exit 1

      - name: Erfolg
        run: |
          echo "Deploy fertig -> https://melder.vv-wildenstein.com"
